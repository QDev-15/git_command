<style>
:root {
  --bg: #fbfaf7; --panel: #f2efe8; --text: #22211f; --muted: #6b675f; --border: #dcd7cc;
  --accent: #b4451f; --code-bg: #ffffff; --hit: #fff1a8; --warn: #b3261e; --comment: #6f7c5a;
  --kw: #1f5fa8; --str: #8a4b08;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --panel: #24221f; --text: #e9e5dc; --muted: #a39d91; --border: #3a3732;
    --accent: #f08a5d; --code-bg: #141312; --hit: #5b4c10; --warn: #ff8a80; --comment: #9bab82;
    --kw: #8ab4f8; --str: #e6b673;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --panel: #24221f; --text: #e9e5dc; --muted: #a39d91; --border: #3a3732;
  --accent: #f08a5d; --code-bg: #141312; --hit: #5b4c10; --warn: #ff8a80; --comment: #9bab82;
  --kw: #8ab4f8; --str: #e6b673;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
  max-width: none; padding: 0;
}
/* Layout: fixed sidebar (search + TOC) + content */
#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 300px; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--border); padding: 16px 14px 40px;
}
#sidebar .brand { font-weight: 700; font-size: 17px; margin-bottom: 10px; }
#search {
  width: 100%; padding: 9px 10px; font-size: 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
}
#search:focus { border-color: var(--accent); }
#search-info { font-size: 12px; color: var(--muted); min-height: 18px; margin: 6px 2px 10px; }
#theme-toggle {
  float: right; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer;
}
nav#TOC ul { list-style: none; padding-left: 12px; margin: 0; }
nav#TOC > ul { padding-left: 0; }
nav#TOC a { color: var(--text); text-decoration: none; display: block; padding: 2px 4px; border-radius: 4px; font-size: 13.5px; }
nav#TOC a:hover { background: var(--border); }
nav#TOC a.active { color: var(--accent); font-weight: 600; }
nav#TOC ul ul a { color: var(--muted); font-size: 12.5px; }
main#content { margin-left: 300px; padding: 28px 40px 80px; max-width: 1180px; }
@media (max-width: 900px) {
  #sidebar { position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--border); max-height: 45vh; }
  main#content { margin-left: 0; padding: 20px 16px 60px; }
}
h1 { font-size: 28px; margin-top: 0; }
h2 { font-size: 21px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; margin-top: 40px; }
h3 { font-size: 17px; margin-top: 26px; }
a { color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
code { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; }
p code, li code, td code { background: var(--panel); padding: 1px 5px; border-radius: 4px; }
table { border-collapse: collapse; margin: 12px 0; width: 100%; }
th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--panel); }
/* Code blocks */
div.sourceCode, pre { position: relative; }
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; overflow-x: auto; line-height: 1.55;
}
pre code > span { display: block; border-radius: 3px; }
pre.cmd-lines code > span { cursor: pointer; }
pre.cmd-lines code > span:hover { background: var(--panel); }
pre code > span > a:first-child::before { display: none; }
code span.co { color: var(--comment); font-style: italic; }
code span.kw, code span.bu, code span.fu { color: var(--kw); }
code span.st, code span.dv { color: var(--str); }
.copy-btn {
  position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); opacity: .75;
}
.copy-btn:hover { opacity: 1; }
.warn { color: var(--warn); font-weight: 700; }
/* Search results */
.hit { background: var(--hit) !important; }
.search-hidden { display: none !important; }
#toast {
  position: fixed; bottom: 18px; right: 18px; background: var(--text); color: var(--bg);
  padding: 7px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: .92; }
</style>
